[workspace]
authors = ["Yoav Ram <yoav@yoavram.com>"]
channels = ["conda-forge"]
name = "modelspopbiol"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
marimo = "marimo"
marimo-edit-population-growth = "marimo edit notebooks/population-growth.py"
marimo-edit-predator-prey = "marimo edit notebooks/predator-prey.py"

[dependencies]
python = "3.11.*"
