[workspace]
authors = ["Yoav Ram <yoavram@tauex.tau.ac.il>"]
channels = ["conda-forge"]
name = "modelspopbiol"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
marimo = "marimo edit . --watch --mcp --no-token"
marimo-check = "marimo check"
lektor = "cd www && lektor serve"

[dependencies]
python = "3.11.*"
numpy = "*"
pandas = "*"
matplotlib = "*"
seaborn = "*"
scipy = "*"
sympy = "*"
numba = ">=0.63.1,<0.64"
pyzmq = ">=27.1.0,<28"
emcee = ">=3.1.6,<4"
pymc = ">=5.28.5,<6"
arviz = ">=0.23.4,<0.24"
marimo = ">=0.23.9,<0.24"

[pypi-dependencies]
marimo = ">=0.23.3"
pydantic-ai = ">=0.2.4, <0.3"
corner = ">=2.2.3,<3"
altair = ">=6.0.0,<7"
mcp = ">=1.26.0,<2"
