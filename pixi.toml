[workspace]
authors = ["Yoav Ram <yoav@yoavram.com>"]
channels = ["conda-forge"]
name = "modelspopbiol"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
marimo = "marimo edit . --watch --mcp --no-token"
marimo-check = "marimo check"

[dependencies]
python = "3.11.*"
numpy = "*"
pandas = "*"
matplotlib = "*"
seaborn = "*"
scipy = "*"
sympy = "*"
numba = ">=0.63.1,<0.64"

[pypi-dependencies]
marimo = { version = ">=0.19.9, <0.20", extras = ["mcp"] }
pydantic-ai = ">=0.2.4, <0.3"
corner = ">=2.2.3,<3"
altair = ">=6.0.0,<7"
mcp = ">=1.26.0,<2"
